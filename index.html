<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTS Academic Practice | MOD 1–3</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1050px;margin:auto;padding:26px 18px}.top{background:#112a4a;color:white;padding:18px 24px}.top-inner{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}.top small{color:#bcd3ef}.pill{background:#214b77;padding:9px 14px;border-radius:30px;font-weight:700}.card{background:white;border:1px solid #dde5ef;border-radius:16px;padding:26px;margin-top:18px;box-shadow:0 8px 24px #112a4a0b}h1{margin:0 0 12px;font-size:28px}h2{font-size:21px;line-height:1.45}p{line-height:1.65;color:#4a5b70}.muted{color:#5d7088}.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;background:#174b86;color:white;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.1)}.btn.secondary{background:#eaf0f7;color:#193c64}.btn.warn{background:#a72c36}.btn:disabled{opacity:.4;cursor:not-allowed}.option{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e2e9f2;border-radius:12px;padding:15px;margin:11px 0;cursor:pointer;line-height:1.5;font-size:15px;color:#1e2e44}.option:hover{border-color:#85add9}.option.selected{border-color:#185fa8;background:#eaf4ff}.letter{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;background:#e9eff7;margin-right:10px;font-weight:700}.progress{height:9px;background:#e5ebf3;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#2277bb;transition:width .2s}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:15px}.navq{border:1px solid #ced9e6;border-radius:8px;background:white;padding:9px 0;cursor:pointer;font-weight:700}.navq.answered{background:#dcecff;border-color:#70a8df}.navq.current{outline:3px solid #1c548e}.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#557394;font-weight:800}.result{border-radius:12px;padding:15px;background:#f4f7fb;margin:12px 0}.right{border-left:5px solid #288563}.wrong{border-left:5px solid #c44850}.review-choice{padding:8px 12px;margin:5px 0;border-radius:7px;background:#f0f3f7}.review-choice.correct{background:#ddf5e8}.review-choice.pickedwrong{background:#ffe5e7}select{padding:10px;border-radius:9px;border:1px solid #b9c8d9;max-width:100%}@media(max-width:600px){.grid{grid-template-columns:repeat(5,1fr)}.card{padding:17px}.top{padding:14px}.top-inner{align-items:flex-start}h1{font-size:23px}}
</style></head><body><header class="top"><div class="top-inner"><div><strong>OTS ACADEMIC PRACTICE</strong><br><small>Modules 1, 2 &amp; 3 · Based on uploaded study guide</small></div><div class="pill" id="clock">90:00</div></div></header><main class="shell" id="app"></main><script>
const BANK=[{"topic": "Professional Relationships", "question": "An officer regularly gives a close friend preferred shifts. Other members begin questioning fairness. What is the primary concern?", "options": ["The friendship is automatically prohibited because it exists off duty.", "The appearance of favoritism may undermine morale and authority.", "Only a written complaint can make the relationship unprofessional.", "Friendships are acceptable whenever both members agree."], "correct": 1, "explanation": "The guide emphasizes perceived favoritism, misuse of position, and damage to morale or authority."}, {"topic": "Professional Relationships", "question": "A senior officer learns that a personal relationship is affecting team cohesion. Which action best reflects the policy described in the guide?", "options": ["Treat it solely as a private choice unless an order is violated.", "Delegate all responsibility to the junior member.", "Recognize both parties’ responsibility while taking senior-rank responsibility for professionalism.", "Ignore the issue because the relationship began off duty."], "correct": 2, "explanation": "Both parties are responsible; the senior rank bears particular responsibility for keeping relationships professional."}, {"topic": "Professional Relationships", "question": "An officer considers lending money to an enlisted colleague. Which assessment best matches the study guide?", "options": ["It is listed among specific prohibitions for officers.", "It is permitted whenever no interest is charged.", "It is prohibited only during deployments.", "It is permitted if the enlisted member initiated the request."], "correct": 0, "explanation": "The guide explicitly lists lending or borrowing money with enlisted members among officer prohibitions."}, {"topic": "Core Values", "question": "A trainee reports their own mistake before anyone notices and accepts responsibility. Which Integrity First virtues are most directly demonstrated?", "options": ["Teamwork and mission", "Loyalty and duty", "Discipline and respect", "Honesty and accountability"], "correct": 3, "explanation": "Honesty preserves trust and accountability means owning actions."}, {"topic": "Core Values", "question": "A leader places a critical mission requirement ahead of a preferred personal activity while treating colleagues respectfully. Which value and virtues best fit?", "options": ["Integrity First; honesty and humility", "Service Before Self; duty and respect", "Excellence in All We Do; precision and breadth", "Service Before Self; teamwork and discipline"], "correct": 1, "explanation": "Service Before Self includes loyalty, duty, and respect in the guide."}, {"topic": "Core Values", "question": "A team consistently improves its procedures through collaboration and high standards. Which value is most directly reflected?", "options": ["Integrity First", "Service Before Self", "Excellence in All We Do", "Character"], "correct": 2, "explanation": "Excellence in All We Do is associated with teamwork, discipline, and mission."}, {"topic": "Guardian Ideal", "question": "A Space Force leader builds trust by inviting feedback and ensuring people feel included. Which Guardian Ideal C is emphasized?", "options": ["Connection", "Courage", "Commitment", "Character"], "correct": 0, "explanation": "Connection focuses on common purpose, dignity, respect, inclusion, and seeking help."}, {"topic": "Constitution", "question": "A trainee says the President enforces laws while Congress makes them. Which principle is illustrated?", "options": ["Federalism", "Enumerated powers", "Judicial review alone", "Separation of powers"], "correct": 3, "explanation": "Separation of powers divides lawmaking, enforcement, and interpretation among branches."}, {"topic": "Constitution", "question": "A commander asks which branch is the source of military authority in this study guide. What is the expected answer?", "options": ["Legislative", "Executive", "Judicial", "State government"], "correct": 1, "explanation": "The study guide identifies the executive branch as the source of military authority."}, {"topic": "Problem Solving", "question": "During a rapidly changing exercise, a flight observes new information, interprets it, chooses a response, and acts. Which method best fits?", "options": ["Practical Problem Solving Method", "Joint Planning Process", "Observe–Orient–Decide–Act loop", "Strengths–Weaknesses–Opportunities–Threats analysis"], "correct": 2, "explanation": "The OODA loop is presented as a rapid, iterative decision cycle."}, {"topic": "Problem Solving", "question": "A recurring supply delay has persisted for months. The team wants to verify root causes, test countermeasures, and standardize a fix. Which method fits best?", "options": ["Practical Problem Solving Method", "Immediate compliance", "Passive management by exception", "A one-time decision without follow-up"], "correct": 0, "explanation": "The guide describes PPSM as the longer-term method with root-cause analysis, countermeasures, and standardization."}, {"topic": "Problem Solving", "question": "After implementing a countermeasure, a team compares results with its measurable goal. Which PPSM step is this?", "options": ["Break down the problem", "Develop countermeasures", "Set improvement target", "Confirm results and process"], "correct": 3, "explanation": "Confirm Results & Process checks whether the target outcome was achieved."}, {"topic": "Critical Thinking", "question": "A team accepts a claim because a respected leader said it, without checking evidence. What is the best corrective action?", "options": ["Treat authority as sufficient proof.", "Evaluate whether reasons and evidence support the claim.", "Focus on the leader’s popularity.", "Avoid asking questions to preserve cohesion."], "correct": 1, "explanation": "Critical thinking evaluates the reasoning and evidence behind assertions."}, {"topic": "Critical Thinking", "question": "A briefing is understandable but lacks specific quantities and timelines. Which intellectual standard needs the most improvement?", "options": ["Fairness", "Breadth", "Precision", "Logic"], "correct": 2, "explanation": "Precision asks for specific details rather than merely understandable wording."}, {"topic": "Critical Thinking", "question": "A planning group considers only its own unit’s perspective. Which intellectual standard is most lacking?", "options": ["Breadth", "Accuracy", "Clarity", "Significance"], "correct": 0, "explanation": "Breadth requires considering alternative perspectives."}, {"topic": "Critical Thinking", "question": "A trainee judges an entire teammate’s competence based on one impressive presentation. Which thinking error is illustrated?", "options": ["Deflection", "Belief perseverance", "System 2 reasoning", "Halo effect"], "correct": 3, "explanation": "The halo effect allows one trait to define a whole person or situation."}, {"topic": "Critical Thinking", "question": "New evidence contradicts a leader’s long-held view, but the leader refuses to reconsider. Which bias best fits?", "options": ["Precision error", "Belief perseverance", "Objective reasoning", "Relevance"], "correct": 1, "explanation": "Belief perseverance is clinging to beliefs despite contrary evidence."}, {"topic": "Team Building", "question": "Newly assembled flight members are learning names, roles, and procedures. Which leader role is most appropriate?", "options": ["Visionary", "Collaborator", "Director", "Coach"], "correct": 2, "explanation": "During forming, the leader acts as director to clarify roles and mission."}, {"topic": "Team Building", "question": "A flight argues about responsibilities and resists collaboration. Which leadership response best fits its stage?", "options": ["Coach the team through open discussion and conflict resolution.", "Withdraw and let conflict continue without support.", "Focus only on future leadership succession.", "Assume settled norms already exist."], "correct": 0, "explanation": "Storming calls for a coach who listens, encourages, and helps resolve conflict."}, {"topic": "Team Building", "question": "A flight has established norms and cooperation and now needs greater member ownership. Which leader role best fits?", "options": ["Director", "Coach", "Visionary", "Collaborator"], "correct": 3, "explanation": "Norming emphasizes collaboration, delegation, and maximizing member strengths."}, {"topic": "Team Building", "question": "A highly capable team independently solves problems and meets goals. What should its leader emphasize?", "options": ["Reassigning all decisions to the leader", "Planning ahead and developing future leaders", "Reintroducing basic team roles every day", "Avoiding feedback because performance is strong"], "correct": 1, "explanation": "Performing teams benefit from a visionary leader who sustains success and cultivates leadership."}, {"topic": "Full-Range Leadership", "question": "A supervisor avoids decisions and provides no subordinate development. Which style is shown?", "options": ["Transactional contingent reward", "Transformational individual consideration", "Laissez-faire", "Active management by exception"], "correct": 2, "explanation": "Laissez-faire is an absence of leadership and is discouraged in the guide."}, {"topic": "Full-Range Leadership", "question": "A leader monitors performance continuously and intervenes at the first sign of a problem. Which behavior is illustrated?", "options": ["Active management by exception", "Passive management by exception", "Individual consideration", "Laissez-faire"], "correct": 0, "explanation": "Active management by exception is proactive monitoring and early intervention."}, {"topic": "Full-Range Leadership", "question": "A leader waits until a significant failure occurs before responding. Which approach best describes this?", "options": ["Intellectual stimulation", "Contingent reward", "Individual consideration", "Passive management by exception"], "correct": 3, "explanation": "Passive management by exception reacts after things go wrong."}, {"topic": "Full-Range Leadership", "question": "An officer asks airmen to challenge established procedures and propose innovative alternatives. Which behavior is strongest?", "options": ["Contingent reward", "Intellectual stimulation", "Passive management by exception", "Laissez-faire"], "correct": 1, "explanation": "Intellectual stimulation encourages creativity and challenges existing procedures."}, {"topic": "Full-Range Leadership", "question": "A supervisor listens to an individual’s career goals and tailors development support. Which behavior best fits?", "options": ["Contingent reward", "Active management by exception", "Individual consideration", "Passive management by exception"], "correct": 2, "explanation": "Individual consideration emphasizes unique needs and subordinate development."}, {"topic": "Followership", "question": "A subordinate thinks independently, takes initiative, and offers constructive feedback. Which followership style is this?", "options": ["Effective follower", "Yes person", "Survivor", "Alienated follower"], "correct": 0, "explanation": "Effective followers are active participants and critical thinkers."}, {"topic": "Followership", "question": "A team member follows every instruction without critical evaluation, even when ethical concerns appear. Which style best fits?", "options": ["Alienated follower", "Survivor", "Effective follower", "Yes person"], "correct": 3, "explanation": "Yes people are active but uncritical and depend on direction."}, {"topic": "Followership", "question": "A capable critic sees flaws but rarely helps solve problems or participates. Which style best fits?", "options": ["Sheep", "Alienated follower", "Yes person", "Effective follower"], "correct": 1, "explanation": "Alienated followers think critically but participate passively."}, {"topic": "Followership", "question": "A follower disagrees with a leader’s plan. What response best matches effective followership?", "options": ["Publicly undermine the leader to force change.", "Stay silent even when risks are serious.", "Raise concerns constructively and keep the leader informed.", "Stop participating until the leader agrees."], "correct": 2, "explanation": "The guide emphasizes initiative, truthfulness, constructive feedback, and keeping leaders informed."}, {"topic": "Conflict Management", "question": "Two sections compete for a fixed number of scarce equipment units and each tries to maximize its own share. What negotiation approach is illustrated?", "options": ["Distributive", "Integrative", "Cooperative problem solving", "Vision framing"], "correct": 0, "explanation": "Distributive negotiation is a win/lose approach involving fixed resources."}, {"topic": "Conflict Management", "question": "Two units redesign their schedules so both can accomplish critical tasks. Which negotiation approach best fits?", "options": ["Distributive", "Insist", "Evade", "Integrative"], "correct": 3, "explanation": "Integrative negotiation seeks a mutually beneficial win/win outcome."}, {"topic": "Conflict Management", "question": "An officer faces a high-stakes issue and must preserve an important working relationship. Which conflict approach best fits?", "options": ["Evade", "Cooperate", "Insist", "Comply"], "correct": 1, "explanation": "Cooperate applies when both the task and relationship are highly important."}, {"topic": "Conflict Management", "question": "A minor disagreement has low task importance and little relationship impact, while more facts are needed. Which approach fits best?", "options": ["Insist", "Cooperate", "Evade", "Settle"], "correct": 2, "explanation": "Evade is appropriate in the guide when both dimensions are low or more information is needed."}, {"topic": "Inspiring Actions", "question": "A statement describes the organization’s desired future condition rather than its present purpose. What is it?", "options": ["Vision statement", "Mission statement", "Resource allocation", "Root-cause statement"], "correct": 0, "explanation": "Vision describes an aspirational future state; mission describes purpose."}, {"topic": "Inspiring Actions", "question": "A leader uses SWOT to decide what to address first. What is the primary purpose described in the guide?", "options": ["To replace all stakeholder input", "To guarantee an uncontested decision", "To measure only employee satisfaction", "To identify positive forces and potential problems"], "correct": 3, "explanation": "SWOT helps reveal strengths and other positive forces along with issues needing attention."}, {"topic": "Change Management", "question": "A leader explains why a new process is necessary and prepares people to accept change. Which Lewin stage is this?", "options": ["Refreezing", "Unfreezing", "Changing", "Performing"], "correct": 1, "explanation": "Unfreezing prepares the organization to accept the need for change."}, {"topic": "Change Management", "question": "A new process has been implemented. Leaders monitor results and reinforce the new routine. Which stage best fits?", "options": ["Unfreezing", "Storming", "Refreezing", "Orientation"], "correct": 2, "explanation": "Refreezing solidifies new processes through continued engagement and evaluation."}, {"topic": "Change Management", "question": "A subordinate resists a new workflow because its effects are unclear. Which source of resistance is most evident?", "options": ["Uncertainty", "Over-determination", "Self-interest", "Different perception"], "correct": 0, "explanation": "Fear of the unknown is listed as uncertainty-driven resistance."}, {"topic": "Establishing Expectations", "question": "A supervisor gives a task but never explains how it supports the larger mission. What should improve first?", "options": ["Add more unrelated details.", "Wait until the task is finished to clarify.", "Avoid seeking team buy-in.", "Connect expectations to higher-level goals."], "correct": 3, "explanation": "The guide recommends linking expectations to higher goals and communicating clearly."}, {"topic": "Organizational Climate", "question": "A unit’s current morale improves quickly after leadership changes, although long-standing traditions remain. What changed most directly?", "options": ["Culture", "Climate", "Federalism", "Doctrine"], "correct": 1, "explanation": "Climate concerns current attitudes and perceptions; culture is more deeply ingrained."}, {"topic": "Organizational Climate", "question": "An officer encourages respectful discussion, safe experimentation, and learning without fear of failure. Which climate strategy is illustrated?", "options": ["Reward competition", "Strictly limit communication", "Emotional safety and security", "Avoid risk discussions"], "correct": 2, "explanation": "The guide identifies respect, openness, trust, and freedom to learn as emotional safety."}, {"topic": "Military Justice", "question": "A service member is suspected of misconduct and asks about the right against involuntary self-incrimination. Which provision is highlighted in the guide?", "options": ["Article 31", "Article 15", "The Joint Planning Process", "The National Military Strategy"], "correct": 0, "explanation": "Article 31 includes protections against compelled self-incrimination."}, {"topic": "Military Justice", "question": "A commander seeks a nonjudicial punitive tool rather than an administrative letter. Which choice best matches the guide?", "options": ["Letter of counseling", "Letter of reprimand", "Control roster", "Article 15"], "correct": 3, "explanation": "Article 15 is listed as nonjudicial punishment; the others are administrative tools."}, {"topic": "Military Justice", "question": "A service member accused of wrongdoing needs defense representation. Which office is identified in the guide?", "options": ["Staff Judge Advocate", "Area Defense Counsel", "Special Victims Counsel", "National Security Council"], "correct": 1, "explanation": "The Area Defense Counsel represents Air Force and Space Force personnel accused of wrongdoing."}, {"topic": "National Security", "question": "A country uses tariffs and embargoes to influence another state’s behavior. Which instrument of power is this?", "options": ["Diplomatic", "Informational", "Economic", "Military"], "correct": 2, "explanation": "The guide lists tariffs and embargoes under the economic instrument."}, {"topic": "What Is War?", "question": "A military planner expects the basic human nature of war to remain constant while technology and methods evolve. What distinction is being made?", "options": ["Nature versus character of war", "Traditional versus irregular warfare", "Fog versus chance", "Policy versus resources"], "correct": 0, "explanation": "The nature of war endures, while its character changes over time."}, {"topic": "DAF Brings to the Fight", "question": "A commander needs a capability that integrates the other Air Force core functions. Which function is it?", "options": ["Rapid global mobility", "Air superiority", "Global precision attack", "Command and control"], "correct": 3, "explanation": "Command and control is identified as integrating the other core functions."}, {"topic": "Military Planning", "question": "A planning team compares alternative courses of action after analyzing them. Which Joint Planning Process step is it performing?", "options": ["Mission analysis", "Course of action comparison", "Planning initiation", "Plan and order development"], "correct": 1, "explanation": "The Joint Planning Process includes comparing analyzed courses of action before approval."}, {"topic": "DAF Deploys", "question": "An Air Force unit cycles through Rest, Prepare, Ready, and Commit. Which readiness model is described?", "options": ["Space Force Force Generation", "Joint Planning Process", "Air Force Force Generation", "Observe–Orient–Decide–Act"], "correct": 2, "explanation": "The study guide lists Rest, Prepare, Ready, and Commit for AFFORGEN."}];
const KEY='ots_mod123_exam_v1';let state={started:false,submitted:false,index:0,answers:Array(50).fill(null),remaining:5400,mode:'all',order:[]};let ticker=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.answers)&&old.answers.length===50)state=old}catch(e){}
function indices(){return state.order.length?state.order:Array.from({length:50},(_,i)=>i)}
function start(mode='all'){clearInterval(ticker);let order=Array.from({length:50},(_,i)=>i);if(mode==='missed'){const prior=indices().filter(i=>state.answers[i]!==BANK[i].correct);if(prior.length)order=prior;else {alert('No missed questions to review.');return}}state={started:true,submitted:false,index:0,answers:Array(50).fill(null),remaining:mode==='missed'?Math.round(5400*order.length/50):5400,mode,order};save();render();runTimer()}
function runTimer(){clearInterval(ticker);if(!state.started||state.submitted)return;ticker=setInterval(()=>{if(state.remaining>0)state.remaining--;if(state.remaining<=0){submit(true);return}document.getElementById('clock').textContent=formatTime(state.remaining);if(state.remaining%5===0)save()},1000)}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function submit(auto=false){if(!auto&&!confirm('Submit your exam? Unanswered questions count as incorrect.'))return;state.submitted=true;clearInterval(ticker);save();render()}
function pick(v){const id=indices()[state.index];state.answers[id]=v;save();render()}
function go(i){state.index=i;save();render()}
function landing(){return `<section class="card"><div class="label">Practice examination</div><h1>Prepare for your OTS academic assessment</h1><p>50 original multiple-choice questions drawn from your uploaded MOD 1, 2 &amp; 3 study guide. Scenario-based application, one best answer per question, with detailed answer review after submission.</p><div class="flex"><span class="pill" style="background:#eaf0f7;color:#173a64">50 questions</span><span class="pill" style="background:#eaf0f7;color:#173a64">90 minutes</span><span class="pill" style="background:#eaf0f7;color:#173a64">70% to pass</span></div><p><strong>Important:</strong> This is an unofficial practice exam, not an actual OTS test. Some study-guide entries are abbreviated; questions avoid relying on unsupported details.</p><button class="btn" onclick="start()">Start 50-question exam →</button></section>`}
function exam(){const ids=indices(),id=ids[state.index],q=BANK[id],answered=ids.filter(i=>state.answers[i]!==null).length;return `<div class="card"><div class="flex between"><div><div class="label">Question ${state.index+1} of ${ids.length}</div><div class="muted">${esc(q.topic)}</div></div><strong>${answered}/${ids.length} answered</strong></div><div class="progress" style="margin-top:16px"><div style="width:${100*answered/ids.length}%"></div></div><h2>${esc(q.question)}</h2><div>${q.options.map((o,i)=>`<button class="option ${state.answers[id]===i?'selected':''}" onclick="pick(${i})"><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div><div class="flex between" style="margin-top:24px"><button class="btn secondary" onclick="go(${Math.max(0,state.index-1)})" ${state.index===0?'disabled':''}>← Previous</button><button class="btn secondary" onclick="go(${Math.min(ids.length-1,state.index+1)})" ${state.index===ids.length-1?'disabled':''}>Next →</button></div></div><section class="card"><div class="flex between"><strong>Question navigator</strong><span class="muted">Blue = answered</span></div><div class="grid">${ids.map((i,n)=>`<button class="navq ${state.answers[i]!==null?'answered':''} ${state.index===n?'current':''}" onclick="go(${n})">${n+1}</button>`).join('')}</div><div class="flex between" style="margin-top:20px"><span class="muted">${ids.length-answered} unanswered</span><button class="btn warn" onclick="submit()">Submit exam</button></div></section>`}
function results(){const ids=indices(),right=ids.filter(i=>state.answers[i]===BANK[i].correct).length,pct=Math.round(right/ids.length*100),passed=pct>=70;return `<section class="card"><div class="label">Exam completed</div><h1>${passed?'Passing score achieved':'Keep practicing'}</h1><h2 style="font-size:36px;margin:5px 0">${pct}% <span class="muted" style="font-size:17px">(${right} / ${ids.length} correct)</span></h2><p>${passed?'You met the 70% practice passing threshold.':'You need at least 70% to pass. Review the explanations below and retake the exam.'}</p><div class="flex"><button class="btn" onclick="start()">Retake full exam</button><button class="btn secondary" onclick="start('missed')">Practice missed questions</button><button class="btn secondary" onclick="window.print()">Print results</button></div></section><section class="card"><h2>Answer review</h2><p>Each item shows your answer, the best answer, and why it fits the study guide.</p>${ids.map((i,n)=>{const q=BANK[i],chosen=state.answers[i],good=chosen===q.correct;return `<article class="result ${good?'right':'wrong'}"><div class="label">${n+1} · ${esc(q.topic)} · ${good?'Correct':'Incorrect'}</div><h3>${esc(q.question)}</h3>${q.options.map((o,k)=>`<div class="review-choice ${k===q.correct?'correct':k===chosen?'pickedwrong':''}"><b>${'ABCD'[k]}.</b> ${esc(o)} ${k===q.correct?'✓ Best answer':k===chosen?'✗ Your answer':''}</div>`).join('')}<p><strong>Your response:</strong> ${chosen===null?'Not answered':'Option '+ 'ABCD'[chosen]}</p><p><strong>Explanation:</strong> ${esc(q.explanation)}</p></article>`}).join('')}</section>`}
function render(){document.getElementById('clock').textContent=formatTime(state.remaining);document.getElementById('app').innerHTML=!state.started?landing():state.submitted?results():exam()}
render();runTimer();
</script></body></html>
