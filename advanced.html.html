<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTS Advanced Practice Exam | Modules 1–3</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#16273d;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#102d50;color:#fff;padding:20px max(20px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:23px}header small{color:#c8d8ea}main{max-width:1100px;margin:22px auto;padding:0 16px}.card{background:#fff;border:1px solid #dbe4ef;border-radius:16px;padding:24px;margin:14px 0;box-shadow:0 5px 20px #1232  }h2{margin:0 0 10px}p{color:#51627a}button,select{font:inherit}button{cursor:pointer;border:0;background:#14589c;color:white;padding:11px 16px;border-radius:10px;font-weight:650}button.secondary{background:#e6eef7;color:#1d4368}button:disabled{opacity:.4;cursor:not-allowed}select{padding:11px;border-radius:9px;border:1px solid #bdccdc}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:#4d718e}.option{display:block;width:100%;text-align:left;padding:15px;border:2px solid #dae4ee;border-radius:10px;background:#fff;color:#223348;margin:10px 0;font-weight:450;line-height:1.55}.option.selected{background:#e6f2ff;border-color:#1465ae}.numgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}.numgrid button{padding:9px 0;background:#eaf0f6;color:#24435e}.numgrid button.done{background:#b8dbfa}.numgrid button.current{outline:3px solid #125ca2}.bar{height:9px;border-radius:8px;background:#e6ecf4;overflow:hidden}.bar span{display:block;background:#1a76bc;height:100%}.correct{border-left:5px solid #20815c}.incorrect{border-left:5px solid #c54848}.review{padding:16px;border-radius:10px;background:#f5f7fa;margin:12px 0}.review li{margin:6px 0}.small{font-size:13px;color:#60738b}.stat{font-size:28px;font-weight:800}#clock{font-weight:800;color:#f9d88a}label{font-weight:700}details{margin-top:12px}summary{cursor:pointer}@media(max-width:650px){.numgrid{grid-template-columns:repeat(5,minmax(0,1fr))}.card{padding:17px}header{padding:17px}header h1{font-size:20px}}</style></head><body><header><div class="flex between"><div><h1>OTS Advanced Practice Exam</h1><small>Modules 1, 2 &amp; 3 · Scenario-based · Bloom’s Taxonomy</small></div><strong id="clockTop">Practice mode</strong></div></header><main id="app"></main><script>const BANK=[{"topic": "Professional Relationships", "question": "An officer regularly gives a close friend preferred shifts. Other members begin questioning fairness. What is the primary concern?", "options": ["The friendship is automatically prohibited because it exists off duty.", "The appearance of favoritism may undermine morale and authority.", "Only a written complaint can make the relationship unprofessional.", "Friendships are acceptable whenever both members agree."], "correct": 1, "explanation": "The guide emphasizes perceived favoritism, misuse of position, and damage to morale or authority."}, {"topic": "Professional Relationships", "question": "A senior officer learns that a personal relationship is affecting team cohesion. Which action best reflects the policy described in the guide?", "options": ["Treat it solely as a private choice unless an order is violated.", "Delegate all responsibility to the junior member.", "Recognize both parties’ responsibility while taking senior-rank responsibility for professionalism.", "Ignore the issue because the relationship began off duty."], "correct": 2, "explanation": "Both parties are responsible; the senior rank bears particular responsibility for keeping relationships professional."}, {"topic": "Professional Relationships", "question": "An officer considers lending money to an enlisted colleague. Which assessment best matches the study guide?", "options": ["It is listed among specific prohibitions for officers.", "It is permitted whenever no interest is charged.", "It is prohibited only during deployments.", "It is permitted if the enlisted member initiated the request."], "correct": 0, "explanation": "The guide explicitly lists lending or borrowing money with enlisted members among officer prohibitions."}, {"topic": "Core Values", "question": "A trainee reports their own mistake before anyone notices and accepts responsibility. Which Integrity First virtues are most directly demonstrated?", "options": ["Teamwork and mission", "Loyalty and duty", "Discipline and respect", "Honesty and accountability"], "correct": 3, "explanation": "Honesty preserves trust and accountability means owning actions."}, {"topic": "Core Values", "question": "A leader places a critical mission requirement ahead of a preferred personal activity while treating colleagues respectfully. Which value and virtues best fit?", "options": ["Integrity First; honesty and humility", "Service Before Self; duty and respect", "Excellence in All We Do; precision and breadth", "Service Before Self; teamwork and discipline"], "correct": 1, "explanation": "Service Before Self includes loyalty, duty, and respect in the guide."}, {"topic": "Core Values", "question": "A team consistently improves its procedures through collaboration and high standards. Which value is most directly reflected?", "options": ["Integrity First", "Service Before Self", "Excellence in All We Do", "Character"], "correct": 2, "explanation": "Excellence in All We Do is associated with teamwork, discipline, and mission."}, {"topic": "Guardian Ideal", "question": "A Space Force leader builds trust by inviting feedback and ensuring people feel included. Which Guardian Ideal C is emphasized?", "options": ["Connection", "Courage", "Commitment", "Character"], "correct": 0, "explanation": "Connection focuses on common purpose, dignity, respect, inclusion, and seeking help."}, {"topic": "Constitution", "question": "A trainee says the President enforces laws while Congress makes them. Which principle is illustrated?", "options": ["Federalism", "Enumerated powers", "Judicial review alone", "Separation of powers"], "correct": 3, "explanation": "Separation of powers divides lawmaking, enforcement, and interpretation among branches."}, {"topic": "Constitution", "question": "A commander asks which branch is the source of military authority in this study guide. What is the expected answer?", "options": ["Legislative", "Executive", "Judicial", "State government"], "correct": 1, "explanation": "The study guide identifies the executive branch as the source of military authority."}, {"topic": "Problem Solving", "question": "During a rapidly changing exercise, a flight observes new information, interprets it, chooses a response, and acts. Which method best fits?", "options": ["Practical Problem Solving Method", "Joint Planning Process", "Observe–Orient–Decide–Act loop", "Strengths–Weaknesses–Opportunities–Threats analysis"], "correct": 2, "explanation": "The OODA loop is presented as a rapid, iterative decision cycle."}, {"topic": "Problem Solving", "question": "A recurring supply delay has persisted for months. The team wants to verify root causes, test countermeasures, and standardize a fix. Which method fits best?", "options": ["Practical Problem Solving Method", "Immediate compliance", "Passive management by exception", "A one-time decision without follow-up"], "correct": 0, "explanation": "The guide describes PPSM as the longer-term method with root-cause analysis, countermeasures, and standardization."}, {"topic": "Problem Solving", "question": "After implementing a countermeasure, a team compares results with its measurable goal. Which PPSM step is this?", "options": ["Break down the problem", "Develop countermeasures", "Set improvement target", "Confirm results and process"], "correct": 3, "explanation": "Confirm Results & Process checks whether the target outcome was achieved."}, {"topic": "Critical Thinking", "question": "A team accepts a claim because a respected leader said it, without checking evidence. What is the best corrective action?", "options": ["Treat authority as sufficient proof.", "Evaluate whether reasons and evidence support the claim.", "Focus on the leader’s popularity.", "Avoid asking questions to preserve cohesion."], "correct": 1, "explanation": "Critical thinking evaluates the reasoning and evidence behind assertions."}, {"topic": "Critical Thinking", "question": "A briefing is understandable but lacks specific quantities and timelines. Which intellectual standard needs the most improvement?", "options": ["Fairness", "Breadth", "Precision", "Logic"], "correct": 2, "explanation": "Precision asks for specific details rather than merely understandable wording."}, {"topic": "Critical Thinking", "question": "A planning group considers only its own unit’s perspective. Which intellectual standard is most lacking?", "options": ["Breadth", "Accuracy", "Clarity", "Significance"], "correct": 0, "explanation": "Breadth requires considering alternative perspectives."}, {"topic": "Critical Thinking", "question": "A trainee judges an entire teammate’s competence based on one impressive presentation. Which thinking error is illustrated?", "options": ["Deflection", "Belief perseverance", "System 2 reasoning", "Halo effect"], "correct": 3, "explanation": "The halo effect allows one trait to define a whole person or situation."}, {"topic": "Critical Thinking", "question": "New evidence contradicts a leader’s long-held view, but the leader refuses to reconsider. Which bias best fits?", "options": ["Precision error", "Belief perseverance", "Objective reasoning", "Relevance"], "correct": 1, "explanation": "Belief perseverance is clinging to beliefs despite contrary evidence."}, {"topic": "Team Building", "question": "Newly assembled flight members are learning names, roles, and procedures. Which leader role is most appropriate?", "options": ["Visionary", "Collaborator", "Director", "Coach"], "correct": 2, "explanation": "During forming, the leader acts as director to clarify roles and mission."}, {"topic": "Team Building", "question": "A flight argues about responsibilities and resists collaboration. Which leadership response best fits its stage?", "options": ["Coach the team through open discussion and conflict resolution.", "Withdraw and let conflict continue without support.", "Focus only on future leadership succession.", "Assume settled norms already exist."], "correct": 0, "explanation": "Storming calls for a coach who listens, encourages, and helps resolve conflict."}, {"topic": "Team Building", "question": "A flight has established norms and cooperation and now needs greater member ownership. Which leader role best fits?", "options": ["Director", "Coach", "Visionary", "Collaborator"], "correct": 3, "explanation": "Norming emphasizes collaboration, delegation, and maximizing member strengths."}, {"topic": "Team Building", "question": "A highly capable team independently solves problems and meets goals. What should its leader emphasize?", "options": ["Reassigning all decisions to the leader", "Planning ahead and developing future leaders", "Reintroducing basic team roles every day", "Avoiding feedback because performance is strong"], "correct": 1, "explanation": "Performing teams benefit from a visionary leader who sustains success and cultivates leadership."}, {"topic": "Full-Range Leadership", "question": "A supervisor avoids decisions and provides no subordinate development. Which style is shown?", "options": ["Transactional contingent reward", "Transformational individual consideration", "Laissez-faire", "Active management by exception"], "correct": 2, "explanation": "Laissez-faire is an absence of leadership and is discouraged in the guide."}, {"topic": "Full-Range Leadership", "question": "A leader monitors performance continuously and intervenes at the first sign of a problem. Which behavior is illustrated?", "options": ["Active management by exception", "Passive management by exception", "Individual consideration", "Laissez-faire"], "correct": 0, "explanation": "Active management by exception is proactive monitoring and early intervention."}, {"topic": "Full-Range Leadership", "question": "A leader waits until a significant failure occurs before responding. Which approach best describes this?", "options": ["Intellectual stimulation", "Contingent reward", "Individual consideration", "Passive management by exception"], "correct": 3, "explanation": "Passive management by exception reacts after things go wrong."}, {"topic": "Full-Range Leadership", "question": "An officer asks airmen to challenge established procedures and propose innovative alternatives. Which behavior is strongest?", "options": ["Contingent reward", "Intellectual stimulation", "Passive management by exception", "Laissez-faire"], "correct": 1, "explanation": "Intellectual stimulation encourages creativity and challenges existing procedures."}, {"topic": "Full-Range Leadership", "question": "A supervisor listens to an individual’s career goals and tailors development support. Which behavior best fits?", "options": ["Contingent reward", "Active management by exception", "Individual consideration", "Passive management by exception"], "correct": 2, "explanation": "Individual consideration emphasizes unique needs and subordinate development."}, {"topic": "Followership", "question": "A subordinate thinks independently, takes initiative, and offers constructive feedback. Which followership style is this?", "options": ["Effective follower", "Yes person", "Survivor", "Alienated follower"], "correct": 0, "explanation": "Effective followers are active participants and critical thinkers."}, {"topic": "Followership", "question": "A team member follows every instruction without critical evaluation, even when ethical concerns appear. Which style best fits?", "options": ["Alienated follower", "Survivor", "Effective follower", "Yes person"], "correct": 3, "explanation": "Yes people are active but uncritical and depend on direction."}, {"topic": "Followership", "question": "A capable critic sees flaws but rarely helps solve problems or participates. Which style best fits?", "options": ["Sheep", "Alienated follower", "Yes person", "Effective follower"], "correct": 1, "explanation": "Alienated followers think critically but participate passively."}, {"topic": "Followership", "question": "A follower disagrees with a leader’s plan. What response best matches effective followership?", "options": ["Publicly undermine the leader to force change.", "Stay silent even when risks are serious.", "Raise concerns constructively and keep the leader informed.", "Stop participating until the leader agrees."], "correct": 2, "explanation": "The guide emphasizes initiative, truthfulness, constructive feedback, and keeping leaders informed."}, {"topic": "Conflict Management", "question": "Two sections compete for a fixed number of scarce equipment units and each tries to maximize its own share. What negotiation approach is illustrated?", "options": ["Distributive", "Integrative", "Cooperative problem solving", "Vision framing"], "correct": 0, "explanation": "Distributive negotiation is a win/lose approach involving fixed resources."}, {"topic": "Conflict Management", "question": "Two units redesign their schedules so both can accomplish critical tasks. Which negotiation approach best fits?", "options": ["Distributive", "Insist", "Evade", "Integrative"], "correct": 3, "explanation": "Integrative negotiation seeks a mutually beneficial win/win outcome."}, {"topic": "Conflict Management", "question": "An officer faces a high-stakes issue and must preserve an important working relationship. Which conflict approach best fits?", "options": ["Evade", "Cooperate", "Insist", "Comply"], "correct": 1, "explanation": "Cooperate applies when both the task and relationship are highly important."}, {"topic": "Conflict Management", "question": "A minor disagreement has low task importance and little relationship impact, while more facts are needed. Which approach fits best?", "options": ["Insist", "Cooperate", "Evade", "Settle"], "correct": 2, "explanation": "Evade is appropriate in the guide when both dimensions are low or more information is needed."}, {"topic": "Inspiring Actions", "question": "A statement describes the organization’s desired future condition rather than its present purpose. What is it?", "options": ["Vision statement", "Mission statement", "Resource allocation", "Root-cause statement"], "correct": 0, "explanation": "Vision describes an aspirational future state; mission describes purpose."}, {"topic": "Inspiring Actions", "question": "A leader uses SWOT to decide what to address first. What is the primary purpose described in the guide?", "options": ["To replace all stakeholder input", "To guarantee an uncontested decision", "To measure only employee satisfaction", "To identify positive forces and potential problems"], "correct": 3, "explanation": "SWOT helps reveal strengths and other positive forces along with issues needing attention."}, {"topic": "Change Management", "question": "A leader explains why a new process is necessary and prepares people to accept change. Which Lewin stage is this?", "options": ["Refreezing", "Unfreezing", "Changing", "Performing"], "correct": 1, "explanation": "Unfreezing prepares the organization to accept the need for change."}, {"topic": "Change Management", "question": "A new process has been implemented. Leaders monitor results and reinforce the new routine. Which stage best fits?", "options": ["Unfreezing", "Storming", "Refreezing", "Orientation"], "correct": 2, "explanation": "Refreezing solidifies new processes through continued engagement and evaluation."}, {"topic": "Change Management", "question": "A subordinate resists a new workflow because its effects are unclear. Which source of resistance is most evident?", "options": ["Uncertainty", "Over-determination", "Self-interest", "Different perception"], "correct": 0, "explanation": "Fear of the unknown is listed as uncertainty-driven resistance."}, {"topic": "Establishing Expectations", "question": "A supervisor gives a task but never explains how it supports the larger mission. What should improve first?", "options": ["Add more unrelated details.", "Wait until the task is finished to clarify.", "Avoid seeking team buy-in.", "Connect expectations to higher-level goals."], "correct": 3, "explanation": "The guide recommends linking expectations to higher goals and communicating clearly."}, {"topic": "Organizational Climate", "question": "A unit’s current morale improves quickly after leadership changes, although long-standing traditions remain. What changed most directly?", "options": ["Culture", "Climate", "Federalism", "Doctrine"], "correct": 1, "explanation": "Climate concerns current attitudes and perceptions; culture is more deeply ingrained."}, {"topic": "Organizational Climate", "question": "An officer encourages respectful discussion, safe experimentation, and learning without fear of failure. Which climate strategy is illustrated?", "options": ["Reward competition", "Strictly limit communication", "Emotional safety and security", "Avoid risk discussions"], "correct": 2, "explanation": "The guide identifies respect, openness, trust, and freedom to learn as emotional safety."}, {"topic": "Military Justice", "question": "A service member is suspected of misconduct and asks about the right against involuntary self-incrimination. Which provision is highlighted in the guide?", "options": ["Article 31", "Article 15", "The Joint Planning Process", "The National Military Strategy"], "correct": 0, "explanation": "Article 31 includes protections against compelled self-incrimination."}, {"topic": "Military Justice", "question": "A commander seeks a nonjudicial punitive tool rather than an administrative letter. Which choice best matches the guide?", "options": ["Letter of counseling", "Letter of reprimand", "Control roster", "Article 15"], "correct": 3, "explanation": "Article 15 is listed as nonjudicial punishment; the others are administrative tools."}, {"topic": "Military Justice", "question": "A service member accused of wrongdoing needs defense representation. Which office is identified in the guide?", "options": ["Staff Judge Advocate", "Area Defense Counsel", "Special Victims Counsel", "National Security Council"], "correct": 1, "explanation": "The Area Defense Counsel represents Air Force and Space Force personnel accused of wrongdoing."}, {"topic": "National Security", "question": "A country uses tariffs and embargoes to influence another state’s behavior. Which instrument of power is this?", "options": ["Diplomatic", "Informational", "Economic", "Military"], "correct": 2, "explanation": "The guide lists tariffs and embargoes under the economic instrument."}, {"topic": "What Is War?", "question": "A military planner expects the basic human nature of war to remain constant while technology and methods evolve. What distinction is being made?", "options": ["Nature versus character of war", "Traditional versus irregular warfare", "Fog versus chance", "Policy versus resources"], "correct": 0, "explanation": "The nature of war endures, while its character changes over time."}, {"topic": "DAF Brings to the Fight", "question": "A commander needs a capability that integrates the other Air Force core functions. Which function is it?", "options": ["Rapid global mobility", "Air superiority", "Global precision attack", "Command and control"], "correct": 3, "explanation": "Command and control is identified as integrating the other core functions."}, {"topic": "Military Planning", "question": "A planning team compares alternative courses of action after analyzing them. Which Joint Planning Process step is it performing?", "options": ["Mission analysis", "Course of action comparison", "Planning initiation", "Plan and order development"], "correct": 1, "explanation": "The Joint Planning Process includes comparing analyzed courses of action before approval."}, {"topic": "DAF Deploys", "question": "An Air Force unit cycles through Rest, Prepare, Ready, and Commit. Which readiness model is described?", "options": ["Space Force Force Generation", "Joint Planning Process", "Air Force Force Generation", "Observe–Orient–Decide–Act"], "correct": 2, "explanation": "The study guide lists Rest, Prepare, Ready, and Commit for AFFORGEN."}, {"topic": "Professional Relationships", "question": "An officer and an enlisted member in different sections plan to share an apartment to save money. They argue that neither supervises the other. Which evaluation best follows the guide?", "options": ["The arrangement is acceptable because their duties do not overlap.", "Sharing living quarters is listed as a specific officer–enlisted prohibition.", "The arrangement becomes a concern only if the commander receives a complaint.", "Sharing quarters is permissible when it reduces personal expenses."], "correct": 1, "explanation": "The guide specifically lists sharing living quarters with enlisted members among officer prohibitions."}, {"topic": "Professional Relationships", "question": "Two officers develop a close relationship that appears to influence assignment decisions. A supervisor says unprofessional relationships apply only to officer–enlisted pairs. What is the best assessment?", "options": ["The supervisor is right because only fraternization affects cohesion.", "The relationship is acceptable if both officers have the same rank.", "The relationship can still be unprofessional when favoritism undermines authority.", "The relationship is exempt because it developed outside duty hours."], "correct": 2, "explanation": "The guide states unprofessional relationships can exist between officers and across multiple status combinations."}, {"topic": "Core Values", "question": "A flight member admits that a shortcut they recommended caused rework, then openly documents the error and helps correct it. Which pair of virtues most directly applies?", "options": ["Honesty and accountability", "Loyalty and respect", "Teamwork and mission", "Discipline and duty"], "correct": 0, "explanation": "Integrity First includes honesty and accountability: telling the truth and owning actions."}, {"topic": "Guardian Ideal", "question": "A Guardian proposes a novel process with a measured operational risk and defends an ethical concern despite pressure. Which Guardian Ideal element is best illustrated?", "options": ["Connection", "Commitment", "Character", "Courage"], "correct": 3, "explanation": "Courage includes standing for what is right, innovation, and smart risk-taking."}, {"topic": "Guardian Ideal", "question": "A supervisor creates deliberate learning goals, solicits feedback, and practices technical skills daily. Which of the four Cs is most evident?", "options": ["Character", "Commitment", "Connection", "Courage"], "correct": 1, "explanation": "Commitment emphasizes mastery of self, profession, and domain through learning and improvement."}, {"topic": "Constitution", "question": "A trainee argues that the military can disregard a federal statute because the President leads the executive branch. Which response best reflects the guide?", "options": ["Executive authority operates alongside obligations to Congress’s laws and court rulings.", "The executive branch can nullify Congress’s laws in all military matters.", "Only state law limits military operations.", "The judiciary makes military laws while Congress interprets them."], "correct": 0, "explanation": "The guide derives military authority from the executive branch while recognizing laws and Supreme Court rulings."}, {"topic": "Constitution", "question": "A state and federal government each exercise authority in their respective spheres. Which constitutional provision best explains this division?", "options": ["Enumerated powers", "Judicial interpretation", "Federalism", "Separation of powers"], "correct": 2, "explanation": "Federalism divides power among federal, state, and local governments."}, {"topic": "Problem Solving", "question": "A logistics team defines a recurring error, identifies when it happens, and sets a measurable reduction target. What should it do next in the guide’s Practical Problem Solving Method?", "options": ["Standardize a proposed process immediately.", "Determine and verify the root cause.", "Present the final results to the commander.", "Choose a solution without additional analysis."], "correct": 1, "explanation": "After clarifying, breaking down, and setting the target, the guide calls for determining root cause."}, {"topic": "Problem Solving", "question": "An officer chooses a rapid response during an exercise but learns that the situation has changed moments later. Which decision approach best supports adaptation?", "options": ["Complete the original plan without reassessment.", "Wait until the exercise ends to evaluate outcomes.", "Use only a long-term standardization process.", "Repeat the Observe–Orient–Decide–Act cycle using the new information."], "correct": 3, "explanation": "The OODA loop is continuous and iterative, supporting rapid reassessment."}, {"topic": "Critical Thinking", "question": "A briefing provides exact figures, but those figures are unrelated to the commander’s decision. Which intellectual standard is most deficient?", "options": ["Accuracy", "Precision", "Relevance", "Clarity"], "correct": 2, "explanation": "Relevance concerns whether information relates to the issue at hand."}, {"topic": "Critical Thinking", "question": "A team explores several plausible causes but gives equal briefing time to a trivial issue and a mission-critical risk. Which intellectual standard needs the most attention?", "options": ["Significance", "Breadth", "Fairness", "Depth"], "correct": 0, "explanation": "Significance focuses reasoning on what matters most."}, {"topic": "Critical Thinking", "question": "An analyst recognizes the complexity of a problem but dismisses a competing viewpoint without consideration. Which standard is most directly missing?", "options": ["Depth", "Breadth", "Accuracy", "Precision"], "correct": 1, "explanation": "Breadth requires consideration of other perspectives."}, {"topic": "Critical Thinking", "question": "During a discussion, a member responds to a question about mission risk by changing the subject to uniform inspections. Which error best describes this behavior?", "options": ["Belief perseverance", "Halo effect", "System 2 thinking", "Deflection"], "correct": 3, "explanation": "Deflection steers discussion away from the question being considered."}, {"topic": "Team Building", "question": "A team has moved beyond arguments and now has stable norms, but members still rely on the leader to assign every task. What is the best next leader action?", "options": ["Return to basic introductions and role identification.", "Escalate conflict to recreate urgency.", "Delegate responsibilities and maximize member strengths.", "Stop providing feedback and focus only on individual performance."], "correct": 2, "explanation": "Norming calls for a collaborator who delegates and develops members’ confidence."}, {"topic": "Full-Range Leadership", "question": "A flight commander promises recognition for achieving a measurable inspection goal and follows through after success. Which behavior best fits?", "options": ["Contingent reward", "Passive management by exception", "Intellectual stimulation", "Laissez-faire"], "correct": 0, "explanation": "Contingent reward links clear performance expectations with rewards."}, {"topic": "Full-Range Leadership", "question": "A supervisor uses early performance checks for a critical safety task, but also invites innovative solutions and coaches a new member individually. Which assessment best matches the guide?", "options": ["The supervisor must use only one leadership style.", "The supervisor is relying exclusively on laissez-faire leadership.", "The supervisor should avoid any combination of transactional and transformational methods.", "The supervisor is blending leadership behaviors to fit the situation."], "correct": 3, "explanation": "The guide recommends adapting and blending full-range leadership approaches while avoiding laissez-faire."}, {"topic": "Followership", "question": "A team member criticizes an ineffective process with sound analysis but refuses to help improve it. Which followership pattern is most consistent?", "options": ["Effective follower", "Alienated follower", "Yes person", "Sheep"], "correct": 1, "explanation": "Alienated followers think critically but participate passively and rarely contribute solutions."}, {"topic": "Followership", "question": "A subordinate receives a questionable direction and immediately agrees despite recognizing potential ethical concerns. Which change would best move them toward effective followership?", "options": ["Stop contributing to team tasks.", "Publicly embarrass the leader to demonstrate independence.", "Raise concerns truthfully and constructively while remaining engaged.", "Avoid giving any feedback until the mission ends."], "correct": 2, "explanation": "Effective followers think independently, take initiative, tell the truth, and give constructive feedback."}, {"topic": "Conflict Management", "question": "Two flight sections share a limited training room. Both must qualify by Friday, and preserving cooperation matters for future operations. What approach best addresses both dimensions?", "options": ["Insist on exclusive use by the first section.", "Comply with the other section regardless of mission effect.", "Evade the discussion until Friday.", "Cooperate on a schedule that meets both critical needs."], "correct": 3, "explanation": "Cooperate is appropriate when both task outcomes and relationships are highly important."}, {"topic": "Conflict Management", "question": "A commander must immediately enforce a safety requirement; preserving rapport is less important than stopping a dangerous practice. Which guide approach best matches this priority?", "options": ["Insist", "Comply", "Evade", "Settle"], "correct": 0, "explanation": "Insist corresponds to high task importance and low relationship priority."}, {"topic": "Conflict Management", "question": "Two teammates disagree because one interpreted an incomplete message differently. Which source of conflict should the leader address first?", "options": ["Structural specialization", "Communication factors", "Resource interdependence", "Reward competition"], "correct": 1, "explanation": "Unclear, incomplete, or misinterpreted information is a communication source of conflict."}, {"topic": "Inspiring Actions", "question": "A unit says, “We provide timely support to deployed teams,” while a second statement describes becoming the most trusted support organization. Which interpretation is strongest?", "options": ["Both statements are missions because they concern work.", "Both statements are visions because they concern performance.", "The first describes present purpose; the second describes an aspirational future.", "The first is a vision because it is measurable; the second is a mission because it is inspiring."], "correct": 2, "explanation": "Mission addresses organizational purpose; vision expresses a desired future state."}, {"topic": "Inspiring Actions", "question": "After presenting a vision, a leader notices that members understand it but lack permission to try new procedures. Which encouragement technique should come next?", "options": ["Repeat the vision without changing conditions.", "Shift focus to individual rewards only.", "Wait for spontaneous adoption.", "Enable action by removing barriers to implementation."], "correct": 3, "explanation": "The guide includes enabling action as a technique for sustaining movement toward a vision."}, {"topic": "Change Management", "question": "A commander announces a new process, but members distrust leadership and fear its consequences. What should be addressed before expecting broad adoption?", "options": ["Prepare members for change and address the reasons for resistance.", "Declare the process permanently established without discussion.", "Assume resistance proves the process is unnecessary.", "Move immediately to standardization without implementation."], "correct": 0, "explanation": "Unfreezing prepares the organization; distrust and uncertainty are listed sources of resistance."}, {"topic": "Change Management", "question": "A new reporting process is operating, but people revert to old habits whenever leaders stop checking. Which stage requires reinforcement?", "options": ["Unfreezing", "Refreezing", "Forming", "Orienting"], "correct": 1, "explanation": "Refreezing solidifies the new process through monitoring and reinforcement."}, {"topic": "Establishing Expectations", "question": "A subordinate understands the overall mission but repeatedly misses a task deadline because instructions omit milestones and reporting requirements. Which improvement is most appropriate?", "options": ["Give only a broad motivational statement.", "Avoid details to reduce communication time.", "Clarify required outcomes, key details, and progress tracking.", "Allow each member to infer their own deadline."], "correct": 2, "explanation": "The guide emphasizes simple, clear communication with necessary details and tracking."}, {"topic": "Organizational Climate", "question": "A new leader finds people reluctant to report mistakes because they expect humiliation. What change best builds the climate described in the guide?", "options": ["Focus solely on physical access controls.", "Preserve the existing practice to maintain tradition.", "Lower all performance standards indefinitely.", "Build emotional safety through respect, openness, and trust."], "correct": 3, "explanation": "Emotional safety supports respectful openness and learning without fear of failure."}, {"topic": "Organizational Climate", "question": "A leader reviews current unit survey results and acts on immediate perceptions while recognizing deeper traditions will take longer to change. Which distinction guides the response?", "options": ["Climate is more adjustable; culture is more deeply ingrained.", "Culture changes daily; climate remains fixed for decades.", "Climate concerns only written policy; culture concerns only weather.", "Culture and climate are interchangeable concepts."], "correct": 0, "explanation": "The guide contrasts current, flexible climate with long-term, ingrained culture."}, {"topic": "Military Justice", "question": "A unit wants to address minor performance problems through a nonpunitive written measure rather than Article 15. Which option is consistent with the guide?", "options": ["General court-martial", "Letter of counseling", "Special court-martial", "Summary court-martial"], "correct": 1, "explanation": "Letters of counseling are listed as administrative actions; courts-martial are judicial punishment."}, {"topic": "Military Justice", "question": "An accused Airman and a victim of an alleged qualifying offense both request legal support. Which matching best follows the guide?", "options": ["Staff Judge Advocate defends the accused; Area Defense Counsel represents commanders.", "Special Victims Counsel prosecutes all offenses; Staff Judge Advocate defends victims.", "Area Defense Counsel represents the accused; Special Victims Counsel advises and represents eligible victims.", "Area Defense Counsel and Staff Judge Advocate are interchangeable offices."], "correct": 2, "explanation": "The guide assigns accused-member defense to ADC and certain victim representation to SVC."}, {"topic": "Military Justice", "question": "A trainee confuses the Uniform Code of Military Justice with the Manual for Courts-Martial. Which explanation best fits the guide?", "options": ["Both are unrelated to military discipline.", "The Manual for Courts-Martial replaces all military law.", "The Uniform Code applies only during overseas deployments.", "The Uniform Code establishes the military justice framework; the Manual provides its operating guidance."], "correct": 3, "explanation": "The guide calls the Manual for Courts-Martial the operator’s manual for military justice."}, {"topic": "National Security", "question": "A national leader seeks to influence another country by building a coalition and negotiating shared objectives rather than threatening force. Which instrument is primary?", "options": ["Diplomatic", "Military", "Economic", "Informational"], "correct": 0, "explanation": "The diplomatic instrument builds mutual understanding and coalitions."}, {"topic": "National Security", "question": "A briefing describes national objectives, a defense approach, and military resource choices. Which sequence matches the guide?", "options": ["National Military Strategy, National Security Strategy, National Defense Strategy", "National Security Strategy, National Defense Strategy, National Military Strategy", "National Defense Strategy, National Military Strategy, National Security Strategy", "National Security Strategy, National Military Strategy, National Defense Strategy"], "correct": 1, "explanation": "The guide sequences NSS (ends), NDS (ways), and NMS (means)."}, {"topic": "National Security", "question": "A planner is asked which strategy is prepared under the Chairman of the Joint Chiefs of Staff and concentrates on organized military forces. Which is most appropriate?", "options": ["National Security Strategy", "National Defense Strategy", "National Military Strategy", "Unit mission statement"], "correct": 2, "explanation": "The guide identifies the National Military Strategy with the CJCS and military means."}, {"topic": "What Is War?", "question": "Two adversaries continue fighting because neither accepts the other’s desired political outcome. Which enduring truth is best illustrated?", "options": ["War always produces predictable results.", "War removes the role of human judgment.", "War is independent of policy.", "War is a clash of opposing wills."], "correct": 3, "explanation": "The guide identifies a clash of opposing wills as one of war’s enduring truths."}, {"topic": "What Is War?", "question": "A plan appears simple in the briefing, but execution is complicated by delays and unexpected obstacles. Which factor described in the guide is most directly illustrated?", "options": ["Friction", "Chance", "Fog", "Irregular warfare"], "correct": 0, "explanation": "The guide describes this difficulty in execution as friction, despite a typo in the notes."}, {"topic": "What Is War?", "question": "A commander receives contradictory and incomplete reports during a fast-moving engagement. Which factor dominates this situation?", "options": ["Chance", "Fog", "Friction", "Character of war"], "correct": 1, "explanation": "Fog concerns confusion, misinformation, and conflicting information."}, {"topic": "What Is War?", "question": "A campaign focuses on influencing a population through non-state actors rather than conventional force-on-force combat. Which category best matches?", "options": ["Traditional warfare", "Global precision attack", "Irregular warfare", "Air superiority"], "correct": 2, "explanation": "The guide characterizes irregular warfare as competition for influence over relevant populations."}, {"topic": "DAF Brings to the Fight", "question": "A joint commander needs to move people and equipment quickly across theaters on demand. Which Air Force core function is most relevant?", "options": ["Global precision attack", "Air superiority", "Global intelligence, surveillance, and reconnaissance", "Rapid global mobility"], "correct": 3, "explanation": "Rapid global mobility provides delivery on demand across operations."}, {"topic": "DAF Brings to the Fight", "question": "A commander needs awareness of a developing target situation to create decision space before choosing an operation. Which Air Force core function best provides this?", "options": ["Global intelligence, surveillance, and reconnaissance", "Air superiority", "Rapid global mobility", "Global precision attack"], "correct": 0, "explanation": "The guide identifies global ISR as providing awareness and decision space."}, {"topic": "DAF Brings to the Fight", "question": "A Space Force unit must contest adversary activity and preserve freedom to operate in the space domain. Which core competency applies?", "options": ["Space access", "Space control", "Global mission operations", "Enterprise"], "correct": 1, "explanation": "Space control comprises activities to contest and control the space domain."}, {"topic": "DAF Brings to the Fight", "question": "A planner treats doctrine as an inflexible order and refuses to adapt it to an unusual situation. Which correction follows the guide?", "options": ["Doctrine is irrelevant to military action.", "Doctrine applies only to administrative tasks.", "Doctrine provides guiding principles that require judgment in application.", "Doctrine guarantees a complete solution for every mission."], "correct": 2, "explanation": "Doctrine is fundamental guidance and official advice, not a rigid directive."}, {"topic": "Military Planning", "question": "A planning staff has several possible courses of action and wants to explore adversary responses and second-order consequences before choosing one. Which step best fits?", "options": ["Planning initiation", "Mission analysis", "Plan and order development", "Course of action analysis and wargaming"], "correct": 3, "explanation": "Wargaming tests courses of action and exposes consequences."}, {"topic": "Military Planning", "question": "A proposed course of action meets the mission goal but requires equipment the unit cannot obtain. Which quality is most clearly missing?", "options": ["Feasible", "Distinguishable", "Suitable", "Complete"], "correct": 0, "explanation": "Feasibility concerns whether the course of action can be accomplished with available resources."}, {"topic": "Military Planning", "question": "Two proposed courses of action are operationally identical except for their titles. Which quality is most clearly missing?", "options": ["Achievable", "Distinguishable", "Complete", "Suitable"], "correct": 1, "explanation": "Distinguishable courses of action offer genuinely different approaches."}, {"topic": "Military Planning", "question": "A commander approves a course of action. The staff then writes an order with situation, mission, execution, administration, and command-and-signal details. Which stage is this?", "options": ["Mission analysis", "Course of action comparison", "Plan and order development", "Planning initiation"], "correct": 2, "explanation": "Plan and order development follows approval and uses the SMEAC structure in the guide."}, {"topic": "DAF Deploys", "question": "A unit follows Prepare, Ready, and Commit without a separate Rest phase. Which cycle matches the guide?", "options": ["Air Force Force Generation", "Practical Problem Solving Method", "Joint Planning Process", "Space Force Force Generation"], "correct": 3, "explanation": "The guide lists Prepare, Ready, and Commit for SPAFORGEN."}, {"topic": "DAF Deploys", "question": "An Air Force unit has just completed its Commit phase and begins its next full force-generation cycle. Which phase comes next in the guide?", "options": ["Rest", "Ready", "Prepare", "Commit"], "correct": 0, "explanation": "AFFORGEN is listed as Rest, Prepare, Ready, and Commit."}, {"topic": "Conflict Management", "question": "A disagreement has little mission impact but preserving the long-term relationship is critical. Which approach best matches the guide’s task–people model?", "options": ["Insist", "Comply", "Evade", "Cooperate"], "correct": 1, "explanation": "Comply is associated with low task importance and high relationship importance."}, const STORE='ots_advanced_mod123_v2';
let st={active:false,finished:false,count:50,order:[],answers:{},at:0,left:5400,mode:'balanced'};
let timer=null;
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function save(){try{localStorage.setItem(STORE,JSON.stringify(st))}catch(e){}}
try{let prev=JSON.parse(localStorage.getItem(STORE));if(prev&&Array.isArray(prev.order)&&prev.order.every(i=>i>=0&&i<BANK.length))st=prev}catch(e){}
function choose(n,mode){let groups={};BANK.forEach((q,i)=>(groups[q.topic]??=[]).push(i));let keys=shuffle(Object.keys(groups));let order=[];if(mode==='balanced'){while(order.length<n){let changed=false;for(const k of keys){if(groups[k].length&&order.length<n){order.push(groups[k].splice(Math.floor(Math.random()*groups[k].length),1)[0]);changed=true}}if(!changed)break}}else order=shuffle(BANK.map((_,i)=>i)).slice(0,n);return shuffle(order)}
function begin(){let n=Number($('count').value),mode=$('mode').value;st={active:true,finished:false,count:n,order:choose(n,mode),answers:{},at:0,left:Math.round(n*108),mode};save();render();tick()}
function missed(){let ids=st.order.filter(i=>st.answers[i]!==BANK[i].correct);if(!ids.length){alert('No missed questions in your last exam.');return}st={active:true,finished:false,count:ids.length,order:shuffle(ids),answers:{},at:0,left:Math.round(ids.length*108),mode:'missed'};save();render();tick()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){clearInterval(timer);if(!st.active||st.finished)return;timer=setInterval(()=>{st.left=Math.max(0,st.left-1);if($('clock'))$('clock').textContent=fmt(st.left);$('clockTop').textContent=fmt(st.left);if(st.left%5===0)save();if(st.left===0)finish(true)},1000)}
function answer(i){st.answers[st.order[st.at]]=i;save();render()}
function goto(i){st.at=i;save();render()}
function finish(auto=false){if(!auto&&!confirm('Submit exam? Unanswered questions count as incorrect.'))return;st.finished=true;clearInterval(timer);save();render()}
function home(){return `<section class="card"><div class="tag">Practice exam setup</div><h2>Advanced scenario-based OTS practice</h2><p>Based on the uploaded Modules 1, 2 &amp; 3 study guide. Questions emphasize applying, analyzing and evaluating realistic leadership and military situations. Four plausible choices; select the single best answer.</p><div class="flex"><label for="count">Number of questions</label><select id="count"><option>10</option><option>20</option><option>30</option><option selected>50</option></select><label for="mode">Question mix</label><select id="mode"><option value="balanced">Balanced across study-guide subjects</option><option value="random">Fully random</option></select></div><p class="small">Time is proportional to 90 minutes for 50 questions: 18 / 36 / 54 / 90 minutes. The full question bank covers all ${new Set(BANK.map(x=>x.topic)).size} subject areas; a 10-question attempt cannot include every area, so balanced mode rotates coverage across attempts.</p><button onclick="begin()">Start exam</button><p class="small">Progress is stored on this device only. Each classmate receives an independent score.</p></section>`}
function exam(){let i=st.order[st.at],q=BANK[i],done=st.order.filter(id=>st.answers[id]!==undefined).length;return `<section class="card"><div class="flex between"><div class="tag">Question ${st.at+1} / ${st.order.length} · ${esc(q.topic)}</div><div><strong id="clock">${fmt(st.left)}</strong></div></div><div class="bar"><span style="width:${done/st.order.length*100}%"></span></div><h2 style="margin-top:20px">${esc(q.question)}</h2>${q.options.map((x,j)=>`<button class="option ${st.answers[i]===j?'selected':''}" onclick="answer(${j})"><b>${'ABCD'[j]}.</b> ${esc(x)}</button>`).join('')}<div class="flex between" style="margin-top:18px"><button class="secondary" ${st.at===0?'disabled':''} onclick="goto(${st.at-1})">Previous</button><span class="small">${done} answered · ${st.order.length-done} remaining</span><button ${st.at===st.order.length-1?'disabled':''} onclick="goto(${st.at+1})">Next</button></div></section><section class="card"><div class="tag">Question navigator</div><div class="numgrid">${st.order.map((id,j)=>`<button class="${st.answers[id]!==undefined?'done':''} ${st.at===j?'current':''}" onclick="goto(${j})">${j+1}</button>`).join('')}</div><div style="margin-top:18px"><button onclick="finish()">Submit exam</button></div></section>`}
function results(){let right=st.order.filter(i=>st.answers[i]===BANK[i].correct).length,percent=Math.round(right/st.order.length*100),miss=st.order.length-right;let topic={};st.order.forEach(i=>{let q=BANK[i];(topic[q.topic]??={yes:0,total:0}).total++;if(st.answers[i]===q.correct)topic[q.topic].yes++});return `<section class="card"><div class="tag">Exam results</div><h2>${percent>=70?'Passed':'Keep practicing'} — ${percent}%</h2><div class="flex"><div><div class="stat">${right}/${st.order.length}</div><span class="small">Correct answers</span></div><div><div class="stat">${miss}</div><span class="small">Incorrect or unanswered</span></div><div><div class="stat">${fmt(st.left)}</div><span class="small">Time remaining</span></div></div><p>Passing threshold: 70%. Review each answer below to see why the best choice fits the guide and why the alternatives are less suitable.</p><div class="flex"><button onclick="reset()">New exam</button><button class="secondary" onclick="missed()">Practice missed questions</button></div></section><section class="card"><h2>Performance by subject</h2>${Object.entries(topic).sort((a,b)=>a[1].yes/a[1].total-b[1].yes/b[1].total).map(([k,v])=>`<div class="flex between"><span>${esc(k)}</span><b>${v.yes}/${v.total}</b></div>`).join('')}</section><section class="card"><h2>Answer review</h2>${st.order.map((id,n)=>{let q=BANK[id],picked=st.answers[id],ok=picked===q.correct;return `<div class="review ${ok?'correct':'incorrect'}"><div class="tag">${n+1}. ${esc(q.topic)} · ${ok?'Correct':'Incorrect'}</div><h3>${esc(q.question)}</h3><ol type="A">${q.options.map((o,j)=>`<li><b>${esc(o)}</b>${j===q.correct?' ✓ Best answer':''}${j===picked&&j!==q.correct?' — Your answer':''}</li>`).join('')}</ol><p><b>Why:</b> ${esc(q.explanation)}</p></div>`}).join('')}</section>`}
function reset(){if(!confirm('Start a new exam? Current results will be replaced.'))return;st.active=false;st.finished=false;save();render()}
function render(){$('app').innerHTML=!st.active?home():st.finished?results():exam();$('clockTop').textContent=st.active&&!st.finished?fmt(st.left):'Practice mode'}
render();tick();</script></body></html>
